<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Inscrição confirmada — Workshop Devolvi Meu Crachá</title>
  <meta name="description" content="Sua inscrição no Workshop Criando Minha Consultoria Lucrativa foi confirmada.">
  <meta property="og:title" content="Inscrição confirmada — Workshop DMC">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    /* ============================================================
       RESET
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    ul, ol { list-style: none; }
    a { text-decoration: none; }
    img, svg { display: block; }
    p { margin: 0; }

    /* ============================================================
       ROOT
    ============================================================ */
    :root {
      --c-bg:            #102A2C;
      --c-dark:          #0a1a1c;
      --c-accent:        #B3A275;
      --c-accent-hover:  #D4C59A;
      --c-secondary:     #00FF5F;
      --c-text-primary:  #F3F0E9;
      --c-text-muted:    rgba(243, 240, 233, 0.7);
      --glass-bg:        rgba(255, 255, 255, 0.03);
      --glass-border:    rgba(255, 255, 255, 0.08);
      --glass-blur:      blur(16px);
      --font-display:    'Montserrat', sans-serif;
      --font-body:       'Inter', sans-serif;
      --container-w:     1200px;
      --header-h:        65px;
    }

    /* ============================================================
       BODY
    ============================================================ */
    body {
      background-color: var(--c-bg);
      background-image:
        radial-gradient(ellipse 70% 50% at 75% 55%, rgba(179, 162, 117, 0.05), transparent 65%),
        radial-gradient(circle at 15% 50%, rgba(179, 162, 117, 0.04), transparent 30%),
        radial-gradient(circle at 85% 30%, rgba(0, 255, 95, 0.025), transparent 28%),
        radial-gradient(ellipse 60% 40% at 50% 90%, rgba(10, 18, 20, 0.6), transparent 70%);
      background-attachment: fixed;
      color: var(--c-text-primary);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100dvh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('ChatGPT%20Image%209_06_2026%2C%2015_09_22.png');
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    /* ============================================================
       TYPOGRAPHY
    ============================================================ */
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.25rem, 7vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .text-gradient {
      background: linear-gradient(90deg, var(--c-accent) 0%, #F5F1E5 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .subhead {
      font-size: 1.0625rem;
      line-height: 1.7;
      color: var(--c-text-muted);
    }

    /* ============================================================
       LAYOUT
    ============================================================ */
    .container {
      max-width: var(--container-w);
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ============================================================
       FOCUS
    ============================================================ */
    :focus-visible {
      outline: 2px solid var(--c-accent);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* ============================================================
       BADGES
    ============================================================ */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-family: var(--font-display);
    }
    .badge-accent {
      background: rgba(179, 162, 117, 0.1);
      color: var(--c-accent);
      border: 1px solid rgba(179, 162, 117, 0.3);
    }

    /* ============================================================
       GLASS PANEL
    ============================================================ */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ============================================================
       ANIMATIONS
    ============================================================ */
    .fadeSlideIn {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fadeSlideIn.visible { opacity: 1; transform: translateY(0); }
    .delay-1 { transition-delay: 0.15s; }
    .delay-2 { transition-delay: 0.3s; }
    .delay-3 { transition-delay: 0.45s; }

    @keyframes floatBlob {
      0%   { transform: translate(0, 0)       rotate(0deg)   scale(1);   }
      100% { transform: translate(50px, 80px) rotate(360deg) scale(1.1); }
    }

    /* ============================================================
       LIQUID BLOB
    ============================================================ */
    .liquid-blob {
      position: fixed;
      width: 500px;
      height: 500px;
      top: -10%;
      left: -10%;
      background: rgba(179, 162, 117, 0.15);
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      filter: blur(80px);
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      animation: floatBlob 20s infinite alternate ease-in-out;
    }

    /* ============================================================
       PAGE WRAPPER
    ============================================================ */
    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 2;
    }

    /* ============================================================
       HEADER
    ============================================================ */
    header {
      height: var(--header-h);
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(16, 42, 44, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    header .container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .logo {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--c-accent);
    }

    /* ============================================================
       MAIN
    ============================================================ */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 40px 0;
    }
    main > .container {
      width: 100%;
    }

    /* ============================================================
       TWO-COLUMN LAYOUT
    ============================================================ */
    .layout {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ============================================================
       IFRAME WRAPPER
    ============================================================ */
    .glass-panel.iframe-wrapper {
      padding: 8px;
    }
    .iframe-wrapper iframe {
      display: block;
      width: 100%;
      height: 600px;
      border: 0;
      border-radius: 16px;
    }

    /* ============================================================
       HOVER — pointer devices only
    ============================================================ */
    @media (hover: hover) {
      .glass-panel:hover {
        transform: translateY(-4px);
        border-color: rgba(179, 162, 117, 0.3);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .glass-panel.iframe-wrapper:hover {
        transform: none;
        border-color: var(--glass-border);
        box-shadow: none;
      }
    }

    /* ============================================================
       DESKTOP (1024px+)
    ============================================================ */
    @media (min-width: 1024px) {
      .container { padding: 0 24px; }
      .glass-panel { padding: 40px; }
      .glass-panel.iframe-wrapper { padding: 8px; }

      .layout {
        flex-direction: row;
        gap: 64px;
        align-items: center;
      }
      .content    { flex: 2; }
      .iframe-wrapper { flex: 3; }
      .iframe-wrapper iframe { height: 640px; }
      .subhead { font-size: 1.125rem; }
    }

    /* ============================================================
       REDUCED MOTION
    ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      .fadeSlideIn { opacity: 1; transform: none; transition: none; }
      .liquid-blob { animation: none; }
      .glass-panel { transition: none; }
    }
  </style>
</head>
<body>

  <div class="liquid-blob" aria-hidden="true"></div>

  <div class="page">
    <header>
      <div class="container">
        <div class="logo">Devolvi Meu Crachá</div>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="layout">
          <div class="content">
            <span class="badge badge-accent fadeSlideIn">
              <i class="fa-solid fa-circle-check" aria-hidden="true"></i> Inscrição confirmada
            </span>
            <h1 class="text-gradient fadeSlideIn delay-1">Parabéns pela decisão!</h1>
            <p class="subhead fadeSlideIn delay-2">
              Agora só falta responder rapinho o questionário pra eu personalizar o workshop pra você. Ao terminar, você terá acesso ao WhatsApp exclusivo e ao Guia de Nichos 2026!
            </p>
          </div>

          <div class="iframe-wrapper glass-panel fadeSlideIn delay-3">
            <iframe
              src="https://form.respondi.app/leVfhi3g"
              title="Questionário do Workshop"
              loading="lazy">
            </iframe>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

      document.querySelectorAll('.fadeSlideIn').forEach(el => observer.observe(el));
    })();
  </script>

</body>
</html>
